[package]
name = "app"
version = "0.2.1"
description = "SubLodeX — Claude Code web UI as a desktop app"
authors = ["Amani Andrea aka The Pirate Pinperepette"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
